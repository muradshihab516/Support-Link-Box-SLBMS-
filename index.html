<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Support Link Box - Admin Platform</title>
    <!-- PWA Manifest & Theme Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <!-- Tailwind CSS Play CDN for instant layout and beautiful styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: {
                750: '#1e293b',
                850: '#0f172a',
              }
            }
          }
        }
      }
    </script>
    <!-- Custom stylesheet for special scrollbar overrides and transitions -->
    <link rel="stylesheet" href="/style.css" />
    <!-- Lucide Icons & html2canvas for high quality PNG downloading -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between selection:bg-indigo-500 selection:text-white">
    
    <div id="app" class="flex flex-col min-h-screen justify-between">
      <!-- App layout will be rendered dynamically by app.js -->
    </div>

    <!-- Main dynamic script -->
    <script type="module" src="/app.js"></script>
  </body>
</html>
